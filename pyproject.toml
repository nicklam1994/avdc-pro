[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avdc-pro"
version = "1.0.0"
description = "AV Data Capture — 元数据刮削器，配合 Emby/Jellyfin/Kodi/Plex 管理本地影片"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "lxml>=4.9",
    "beautifulsoup4>=4.11",
    "pyquery>=1.4",
    "Pillow>=9.0",
    "cloudscraper>=1.2",
    "PySocks>=1.7",
]

[project.optional-dependencies]
gui = ["PyQt5>=5.15"]
dev = ["pytest>=7.0", "ruff>=0.1", "responses>=0.23"]

[project.scripts]
avdc = "avdc.cli:main"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
